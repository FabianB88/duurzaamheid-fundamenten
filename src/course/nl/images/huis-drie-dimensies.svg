<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-label="Duurzaamheid als een huis in drie lagen">
  <style>
    .t { font-family: Inter, Lato, Helvetica, Arial, sans-serif; }
    .hd  { font-size: 17px; font-weight: 700; fill: #3D5C3B; }
    .lbl { font-size: 15.5px; font-weight: 700; fill: #1C1713; }
    .sub { font-size: 13px; fill: #57504A; }
    .cap { font-size: 12.5px; fill: #57504A; font-style: italic; }
    .in  { font-size: 13px; font-weight: 700; fill: #3D5C3B; }
  </style>
  <rect width="700" height="470" fill="#F7F4F0"/>

  <text class="t hd" x="20" y="30">Duurzaamheid als een huis</text>
  <line x1="20" y1="42" x2="680" y2="42" stroke="#E4DDD6" stroke-width="1"/>

  <!-- dak -->
  <polygon points="200,120 60,215 340,215" fill="#EFF4EE" stroke="#5C7A5A" stroke-width="2"/>

  <!-- muren -->
  <rect x="80" y="215" width="240" height="150" fill="#EFF4EE" stroke="#5C7A5A" stroke-width="2"/>

  <!-- interieur -->
  <rect x="112" y="245" width="176" height="92" rx="4" fill="#D0E3CF" stroke="#3D5C3B" stroke-width="1.5"/>
  <text class="t in" x="200" y="285" text-anchor="middle">welzijn &#183; gelijkheid</text>
  <text class="t in" x="200" y="305" text-anchor="middle">veiligheid &#183; meedoen</text>

  <!-- fundament -->
  <rect x="52" y="365" width="296" height="52" rx="4" fill="#5C7A5A" stroke="#3D5C3B" stroke-width="2"/>
  <text class="t" x="200" y="396" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">bodem &#183; water &#183; klimaat &#183; biodiversiteit</text>

  <!-- verbindingspijl langs de zijkant -->
  <path d="M 372 150 L 372 400" stroke="#7A6E66" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M 372 150 l -5 9 l 10 0 z" fill="#7A6E66"/>
  <path d="M 372 400 l -5 -9 l 10 0 z" fill="#7A6E66"/>
  <text class="t cap" x="380" y="278" transform="rotate(-90 380 278)" text-anchor="middle">de lagen bewegen mee</text>

  <!-- labels rechts -->
  <line x1="340" y1="175" x2="418" y2="175" stroke="#B0A49A" stroke-width="1"/>
  <text class="t lbl" x="426" y="171">Economisch &#8212; de structuur</text>
  <text class="t sub" x="426" y="191">Hoe we waarde maken en verdelen,</text>
  <text class="t sub" x="426" y="208">binnen wat het fundament draagt.</text>

  <line x1="288" y1="291" x2="418" y2="291" stroke="#B0A49A" stroke-width="1"/>
  <text class="t lbl" x="426" y="287">Sociaal &#8212; het interieur</text>
  <text class="t sub" x="426" y="307">Het leven dat zich in het huis</text>
  <text class="t sub" x="426" y="324">afspeelt: voor wie is het gebouwd?</text>

  <line x1="348" y1="391" x2="418" y2="391" stroke="#B0A49A" stroke-width="1"/>
  <text class="t lbl" x="426" y="387">Ecologisch &#8212; het fundament</text>
  <text class="t sub" x="426" y="407">Draagt de andere twee. Verzwakt dit,</text>
  <text class="t sub" x="426" y="424">dan zakt het huis in.</text>

  <text class="t cap" x="20" y="452">Raakt &#233;&#233;n laag uit balans, dan verliest het geheel zijn stabiliteit.</text>
</svg>

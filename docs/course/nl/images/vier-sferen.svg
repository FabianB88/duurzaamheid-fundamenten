<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-label="De vier sferen van het aardsysteem">
  <style>
    .t { font-family: Inter, Lato, Helvetica, Arial, sans-serif; }
    .hd  { font-size: 17px; font-weight: 700; fill: #3D5C3B; }
    .lbl { font-size: 14.5px; font-weight: 700; fill: #1C1713; }
    .sub { font-size: 12.5px; fill: #57504A; }
    .cap { font-size: 12.5px; fill: #57504A; font-style: italic; }
    .ring{ font-size: 12.5px; font-weight: 700; fill: #3D5C3B; }
  </style>
  <defs>
    <marker id="pijl4" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#7A6E66"/>
    </marker>
  </defs>
  <rect width="700" height="470" fill="#F7F4F0"/>

  <text class="t hd" x="20" y="30">De vier sferen van het aardsysteem</text>
  <line x1="20" y1="42" x2="680" y2="42" stroke="#E4DDD6" stroke-width="1"/>

  <!-- ringen -->
  <circle cx="215" cy="255" r="150" fill="#FFFFFF" stroke="#B0A49A" stroke-width="1.5"/>
  <circle cx="215" cy="255" r="116" fill="#F3EFE8" stroke="#B0A49A" stroke-width="1.5"/>
  <circle cx="215" cy="255" r="82"  fill="#EFF4EE" stroke="#5C7A5A" stroke-width="1.5"/>
  <circle cx="215" cy="255" r="46"  fill="#D0E3CF" stroke="#3D5C3B" stroke-width="2"/>

  <text class="t ring" x="215" y="126" text-anchor="middle">ATMOSFEER</text>
  <text class="t ring" x="215" y="160" text-anchor="middle">HYDROSFEER</text>
  <text class="t ring" x="215" y="194" text-anchor="middle">LITHOSFEER</text>
  <text class="t ring" x="215" y="252" text-anchor="middle">BIOSFEER</text>
  <text class="t sub"  x="215" y="270" text-anchor="middle">al het leven</text>

  <!-- pijlen die door de ringen heen gaan -->
  <path d="M 215 300 L 215 340" stroke="#7A6E66" stroke-width="1.6" marker-end="url(#pijl4)" fill="none"/>
  <path d="M 168 232 L 128 208" stroke="#7A6E66" stroke-width="1.6" marker-end="url(#pijl4)" fill="none"/>
  <path d="M 262 232 L 302 208" stroke="#7A6E66" stroke-width="1.6" marker-end="url(#pijl4)" fill="none"/>

  <!-- toelichtingen rechts -->
  <text class="t lbl" x="400" y="112">Atmosfeer</text>
  <text class="t sub" x="400" y="131">De luchtlaag: reguleert klimaat en houdt</text>
  <text class="t sub" x="400" y="147">schadelijke straling tegen.</text>

  <text class="t lbl" x="400" y="182">Hydrosfeer</text>
  <text class="t sub" x="400" y="201">Al het water &#8212; vloeibaar, vast en damp.</text>
  <text class="t sub" x="400" y="217">Stuurt weer, voedsel en transport.</text>

  <text class="t lbl" x="400" y="252">Lithosfeer</text>
  <text class="t sub" x="400" y="271">Korst en bodem: gesteente, mineralen,</text>
  <text class="t sub" x="400" y="287">grondstoffen. Herstelt het traagst.</text>

  <text class="t lbl" x="400" y="322">Biosfeer</text>
  <text class="t sub" x="400" y="341">Al het leven. Zit als enige in alle drie</text>
  <text class="t sub" x="400" y="357">de andere sferen tegelijk.</text>

  <rect x="400" y="378" width="280" height="56" rx="8" fill="#EFF4EE" stroke="#5C7A5A" stroke-width="1.5"/>
  <text class="t sub" x="414" y="399">Stikstof loopt door alle vier: bodem &#8594;</text>
  <text class="t sub" x="414" y="416">grondwater &#8594; lucht &#8594; kwetsbare natuur.</text>

  <text class="t cap" x="20" y="452">De indeling is een hulpmiddel; in werkelijkheid lopen de sferen in elkaar over.</text>
</svg>

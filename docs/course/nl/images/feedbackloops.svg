<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" aria-label="Versterkende en dempende feedbackloops, en een kantelpunt">
  <style>
    .t { font-family: Inter, Lato, Helvetica, Arial, sans-serif; }
    .hd  { font-size: 17px; font-weight: 700; fill: #3D5C3B; }
    .kop { font-size: 15px; font-weight: 700; fill: #1C1713; }
    .nd  { font-size: 12px; fill: #1C1713; }
    .sub { font-size: 12.5px; fill: #57504A; }
    .cap { font-size: 12.5px; fill: #57504A; font-style: italic; }
    .tk  { font-size: 13px; font-weight: 700; fill: #3D5C3B; }
  </style>
  <defs>
    <marker id="fv" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#3D5C3B"/>
    </marker>
    <marker id="fd" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#7A6E66"/>
    </marker>
  </defs>
  <rect width="700" height="520" fill="#F7F4F0"/>

  <text class="t hd" x="20" y="30">Twee soorten lussen, en het punt waarop het omslaat</text>
  <line x1="20" y1="42" x2="680" y2="42" stroke="#E4DDD6" stroke-width="1"/>

  <!-- VERSTERKENDE LUS -->
  <text class="t kop" x="20" y="72">Versterkend &#8212; jaagt zichzelf aan</text>
  <circle cx="175" cy="196" r="86" fill="none" stroke="#5C7A5A" stroke-width="2.5"/>
  <path d="M 224.3 125.6 A 86 86 0 0 1 256.8 169.4" fill="none" stroke="#3D5C3B" stroke-width="2.5" marker-end="url(#fv)"/>
  <path d="M 256.8 222.6 A 86 86 0 0 1 224.3 266.4" fill="none" stroke="#3D5C3B" stroke-width="2.5" marker-end="url(#fv)"/>
  <path d="M 125.7 266.4 A 86 86 0 0 1 93.2 222.6" fill="none" stroke="#3D5C3B" stroke-width="2.5" marker-end="url(#fv)"/>
  <path d="M 93.2 169.4 A 86 86 0 0 1 125.7 125.6" fill="none" stroke="#3D5C3B" stroke-width="2.5" marker-end="url(#fv)"/>

  <rect x="118" y="88" width="114" height="34" rx="5" fill="#3D5C3B"/>
  <text class="t" x="175" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">meer opwarming</text>

  <rect x="238" y="180" width="112" height="34" rx="5" fill="#FFFFFF" stroke="#3D5C3B" stroke-width="1.5"/>
  <text class="t nd" x="294" y="202" text-anchor="middle">ijs smelt</text>

  <rect x="118" y="272" width="114" height="34" rx="5" fill="#FFFFFF" stroke="#3D5C3B" stroke-width="1.5"/>
  <text class="t nd" x="175" y="288" text-anchor="middle">donker water neemt</text>
  <text class="t nd" x="175" y="301" text-anchor="middle">meer zonlicht op</text>

  <rect x="4" y="180" width="112" height="34" rx="5" fill="#FFFFFF" stroke="#3D5C3B" stroke-width="1.5"/>
  <text class="t nd" x="60" y="202" text-anchor="middle">minder weerkaatsing</text>

  <text class="t" x="175" y="202" text-anchor="middle" font-size="30" font-weight="700" fill="#5C7A5A">+</text>

  <!-- DEMPENDE LUS -->
  <text class="t kop" x="392" y="72">Dempend &#8212; remt af</text>
  <circle cx="524" cy="196" r="86" fill="none" stroke="#B0A49A" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M 573.3 125.6 A 86 86 0 0 1 605.8 169.4" fill="none" stroke="#7A6E66" stroke-width="2.5" marker-end="url(#fd)"/>
  <path d="M 605.8 222.6 A 86 86 0 0 1 573.3 266.4" fill="none" stroke="#7A6E66" stroke-width="2.5" marker-end="url(#fd)"/>
  <path d="M 474.7 266.4 A 86 86 0 0 1 442.2 222.6" fill="none" stroke="#7A6E66" stroke-width="2.5" marker-end="url(#fd)"/>
  <path d="M 442.2 169.4 A 86 86 0 0 1 474.7 125.6" fill="none" stroke="#7A6E66" stroke-width="2.5" marker-end="url(#fd)"/>

  <rect x="467" y="88" width="114" height="34" rx="5" fill="#7A6E66"/>
  <text class="t" x="524" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">meer opwarming</text>

  <rect x="587" y="180" width="108" height="34" rx="5" fill="#FFFFFF" stroke="#7A6E66" stroke-width="1.5"/>
  <text class="t nd" x="641" y="196" text-anchor="middle">meer CO&#8322; en</text>
  <text class="t nd" x="641" y="209" text-anchor="middle">warmte in lucht</text>

  <rect x="467" y="272" width="114" height="34" rx="5" fill="#FFFFFF" stroke="#7A6E66" stroke-width="1.5"/>
  <text class="t nd" x="524" y="294" text-anchor="middle">oceanen nemen CO&#8322; op</text>

  <rect x="353" y="180" width="108" height="34" rx="5" fill="#FFFFFF" stroke="#7A6E66" stroke-width="1.5"/>
  <text class="t nd" x="407" y="202" text-anchor="middle">meer plantengroei</text>

  <text class="t" x="524" y="206" text-anchor="middle" font-size="34" font-weight="700" fill="#B0A49A">&#8722;</text>

  <!-- KANTELPUNT -->
  <line x1="20" y1="330" x2="680" y2="330" stroke="#E4DDD6" stroke-width="1"/>
  <text class="t kop" x="20" y="358">Kantelpunt</text>

  <line x1="70" y1="466" x2="640" y2="466" stroke="#B0A49A" stroke-width="1.5"/>
  <line x1="70" y1="466" x2="70" y2="374" stroke="#B0A49A" stroke-width="1.5"/>
  <text class="t sub" x="640" y="484" text-anchor="end">tijd</text>
  <text class="t sub" x="64" y="380" text-anchor="end" transform="rotate(-90 64 380)">toestand</text>

  <path d="M 70 452 C 190 446, 300 430, 392 410" fill="none" stroke="#5C7A5A" stroke-width="3"/>
  <path d="M 392 410 C 424 402, 436 396, 448 388" fill="none" stroke="#5C7A5A" stroke-width="3"/>
  <path d="M 448 388 C 470 372, 486 400, 512 430 C 540 462, 580 462, 630 458" fill="none" stroke="#3D5C3B" stroke-width="3" stroke-dasharray="7 5"/>

  <circle cx="448" cy="388" r="6.5" fill="#3D5C3B"/>
  <line x1="448" y1="381" x2="448" y2="352" stroke="#3D5C3B" stroke-width="1.5"/>
  <text class="t tk" x="448" y="346" text-anchor="middle">kantelpunt</text>

  <text class="t sub" x="86" y="440">geleidelijk</text>
  <text class="t sub" x="540" y="440">nieuwe toestand,</text>
  <text class="t sub" x="540" y="456">keert niet vanzelf terug</text>

  <text class="t cap" x="20" y="506">Tot het kantelpunt lijkt verandering omkeerbaar. Erna geldt een ander evenwicht.</text>
</svg>
